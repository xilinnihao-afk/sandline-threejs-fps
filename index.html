<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/><meta name="theme-color" content="#171c1b"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/><meta name="description" content="沙线行动：原创手机单机战术射击游戏。"/><link rel="manifest" href="./manifest.webmanifest"/><link rel="icon" href="./icon.svg" type="image/svg+xml"/><link rel="apple-touch-icon" href="./icon-192.png"/><title>沙线行动 · SANDLINE</title><script>
// Preserve a readable recovery path even if the lightweight module cannot load.
(function () {
  function showEntryFailure() {
    var error = document.getElementById('entry-failure');
    if (error) error.hidden = false;
    else document.addEventListener('DOMContentLoaded', showEntryFailure, {once:true});
  }
  window.addEventListener('error', function (event) {
    if (event.target && event.target.tagName === 'SCRIPT' && event.target.type === 'module') showEntryFailure();
  }, true);
  document.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
      var loading = document.getElementById('startup-status');
      if (loading && loading.dataset.started !== 'true') showEntryFailure();
    }, 30000);
  });
})();
</script><link rel="stylesheet" href="/src/ui/welcome.css"/><script defer src="./visit-metrics.js" data-site="sandline"></script>
<script defer src="./feedback-entry.js" data-site="sandline"></script>
</head><body>
<section id="portrait-startup" role="status" aria-label="横屏提示"><span aria-hidden="true">↻</span><strong>请横屏游玩《沙线行动》</strong><p>转动手机后继续</p></section>
<section id="startup-status" class="loading-shell" aria-label="游戏加载">
 <img id="loading-art" class="loading-art" src="./assets/ui/desert-preview.jpg" alt="沙线行动战场" fetchpriority="high"><div class="loading-shade"></div>
 <div class="loading-title"><span>SANDLINE / TACTICAL OPERATIONS</span><h1>沙线行动</h1><p>选择战场 · 整装出击</p></div>
 <div class="loading-card">
  <div class="loading-brand">LOADING OPERATION</div>
  <div id="startup-progress-area" role="status" aria-live="polite">
   <strong id="startup-label">正在加载游戏程序…</strong>
   <progress id="startup-progress" value="0" max="100" aria-label="游戏加载进度"></progress>
   <span id="startup-progress-text">0%</span>
   <p id="startup-detail">首次加载需要下载资源，请保持页面打开。</p>
   <button id="startup-retry" hidden>重新加载</button>
  </div>
  <p class="loading-browser-tip">横屏作战 · 推荐使用 Chrome / Safari</p>
  <nav class="loading-links" aria-label="加载帮助"><button data-community="help">操作说明</button><button data-community="feedback">问题反馈</button></nav>
  <noscript><p>请启用 JavaScript 后重新打开游戏。</p></noscript>
  <p id="entry-failure" hidden>入口程序加载失败，请检查网络后 <a href="" onclick="location.reload();return false">重新加载</a>。</p>
 </div>
</section>
<script src="./site-config.js"></script>
<script type="module" src="/src/entry.ts"></script>
</body></html>
